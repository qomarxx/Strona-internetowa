<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cowboy Bebop</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Rhodium+Libre&display=swap"
    rel="stylesheet"
  />
  <body>
    <nav class="navbar">
      <ul class="nav-links">
        <li><a href="home.html">Home</a></li>
        <li><a href="kontakt.html">Kontakt</a></li>
        <li><a href="galeria.html">Galeria</a></li>
        <li><a href="muzyka.html">Muzyka</a></li>
      </ul>
    </nav>
    <main class="main-container">
      <h1>Cowboy Bebop</h1>
      <div class="podstrony">
        <a href="home.html" class="home">Home</a>
        <div class="cur">
          <img src="swordfish.png" alt="Swordfish" class="swordfish" />
          <a href="kontakt.html" class="kontakt">Kontakt</a>
        </div>
        <a href="galeria.html" class="galeria">Galeria</a>
        <a href="muzyka.html" class="muzyka">Muzyka</a>
      </div>
      <h2 class="formularz">Formularz</h2>
      <form action="#" method="POST">
        <div>
          <label for="email">E-Mail:</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="Wpisz adres e-mail..."
            required
          />
        </div>
        <div>
          <label for="temat">Temat wiadomości:</label>
          <select id="temat" name="temat">
            <option value="pytanie">Pytanie</option>
            <option value="wspolpraca">Współpraca</option>
            <option value="fanmail">Fan mail</option>
            <option value="inne">Inne</option>
          </select>
        </div>
        <div>
          <label for="wiadomosc">Wiadomość:</label>
          <textarea
            id="wiadomosc"
            name="wiadomosc"
            rows="5"
            placeholder="Wpisz treść wiadomości..."
            required
          ></textarea>
        </div>
        <div>
          <input type="submit" value="Wyślij" />
        </div>
      </form>
    </main>
    <script src="home.js"></script>
    <footer>
      <p>Patryk Skupień</p>
    </footer>
  </body>
</html>
